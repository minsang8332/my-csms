services:
  csms-db:
    build:
      context: ./csms-db
    container_name: csms-db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DOCKER_MYSQL_DATABASE}
      MYSQL_USER: ${DOCKER_MYSQL_USER}
      MYSQL_PASSWORD: ${DOCKER_MYSQL_PASSWORD}
    volumes:
      - ./csms-db/data:/var/lib/mysql
      - ./csms-db/backup:/csms-db/backup
    networks:
      - csms-network
    ports:
      - "127.0.0.1:3306:3306"
    restart: always

  csms-api:
    build:
      context: ./csms-api
      target: ${DOCKER_BUILD_TARGET:-production}
    volumes:
      - ${DOCKER_API_VOLUME_MOUNT:-./csms-api/src}:/usr/src/app/src
      - ./csms-api/prisma:/usr/src/app/prisma
      - ./csms-db/backup:/csms-db/backup
      - ./csms-db/backup:/usr/src/app/csms-db/backup
    command: sh -c "npx prisma db push && ${DOCKER_API_COMMAND:-node dist/main.js}"
    container_name: csms-api
    env_file:
      - .env
    environment:
      # 컨테이너 내부에서는 서비스 이름(csms-db)으로 연결한다.
      # .env의 로컬 MySQL URL을 중복 관리하지 않는다.
      MYSQL_DATABASE_URL: "mysql://${DOCKER_MYSQL_USER}:${DOCKER_MYSQL_PASSWORD}@${DOCKER_MYSQL_HOST}:${DOCKER_MYSQL_PORT}/${DOCKER_MYSQL_DATABASE}"
    depends_on:
      - csms-db
    networks:
      - csms-network
    restart: always

  csms-proxy:
    build:
      context: .
      dockerfile: ./csms-proxy/Dockerfile
    container_name: csms-proxy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - csms-proxy-certs:/etc/nginx/ssl
      - csms-proxy-acme:/var/www/html
      - csms-proxy-getssl:/root/.getssl
    depends_on:
      - csms-api
    networks:
      - csms-network
    restart: always

volumes:
  csms-proxy-certs:
  csms-proxy-acme:
  csms-proxy-getssl:

networks:
  csms-network:
    driver: bridge
